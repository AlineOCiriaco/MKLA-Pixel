<!DOCTYPE html> <!--Artefato histórico que precisa ser incluído para que tudo funcione corretamente. DOCTYPE html é a
menor cadeia de caracteres que conta como um doctype válido-->
<html lang="pt-BR">

<head>
    <meta charset="UTF-8"> <!--Este elemento define o tipo da codificação dos caracteres que o seu documento deve usar,
    neste caso, para o tipo UTF-8, que inclui a maioria dos caracteres das linguas humanas escritas.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MKLA Pixel</title>
</head> <!-- O elemento head atua como um container para todo o conteúdo da página HTML que não é visível para os
visitantes do site. -->

<body> <!-- O elemento body contém todo o conteúdo que você quer mostrar aos usuários quando eles visitarem sua página,
    como texto, imagens, vídeos, jogos, faixas de áudio reproduzíveis, ou qualquer outra coisa. -->
    <h1>MKLA Pixel</h1>
    <p>Empresa de tecnologia focada em fazer o seu negócio crescer.</p>

    <ul class="lista"> <!-- O elemento ul representa uma lista não ordenada de itens, tipicamente renderizada como uma lista com marcadores. -->
        <li>html</li>
        <li>javascript</li>
        <li>css</li>
    </ul>
</body>

</html>
